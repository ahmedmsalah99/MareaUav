apriltagrescue:
    apriltag2rescue:
        ros__parameters:
            image_transport: compressed
            family: 36h11           # tag family, one of 16h5, 25h7, 25h9, 36h10, 36h11, 36artoolkit
            size: 0.195             # tag edge size in meter
            max_hamming: 0          # maximum allowed hamming distance (corrected bits)
            z_up: true              # rotate about x-axis to have Z pointing upwards

            # see "apriltag.h" for more documentation on these optional parameters
            decimate: 1.0           # decimate resolution for quad detection
            blur: 0.0               # sigma of Gaussian blur for quad detection
            refine-edges: 0         # snap to strong gradients
            threads: 1              # number of threads
            refine-decode: 0        # increase the number of detected tags
            refine-pose: 0          # increase the accuracy of the extracted pose
            debug: 0                # write additional debugging images to current working directory
            n_tags: 1
            tag_1: 0.195	    

            x_err_thld: 50.0
            y_err_thld: 50.0
            z_err_thld: 50.0
            z_std_alt: -6.0
