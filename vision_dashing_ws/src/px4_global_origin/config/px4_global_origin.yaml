# PX4 global origin for mocap in sim (M2M_MODE=3). In the lab (M2M_MODE=1) the lab node time_synchro_gps_sys does this.
# With mocap only, PX4 has a local position but no global reference; this sets one once.
# No in-code defaults: a missing key stops the node.
px4_global_origin:
  ros__parameters:
    latitude_deg:     44.40353187618028   # lab origin (from the lab's time_synchro_gps_sys)
    longitude_deg:    8.958392568821875
    altitude_m:       0.0
    fmu_prefix:       ""                  # "" -> /fmu/..., e.g. "/x500_2" for a namespaced PX4
    target_system:    1                   # MAV_SYS_ID of the PX4 to configure
    resend_period_s:  0.5                 # resend until PX4 acknowledges
    give_up_after_s:  60.0                # stop (with an error) if never accepted
