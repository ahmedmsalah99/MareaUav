# Mocap lab boundaries: the single source of truth for the flight area.
# Read by mocap_boundaries_check (hard layer: flags the drone when it is out) and by
# guidance_system's geofence (soft layer: keeps setpoints inside) in mocap modes (1, 3).
# Frame: PX4 local frame as ENU (x = east, y = north, z = up) [m].
mocap_boundaries_check_handler:
  ros__parameters:
    # Polygon vertices in order, flattened as [x0, y0, x1, y1, ...].
    vertices_xy: [-0.7911, -2.031,
                  -1.378,  -0.838,
                  -1.532,   0.574,
                  -1.284,   1.881,
                  -0.184,   2.429,
                   1.021,   2.035,
                   1.470,   0.834,
                   1.379,  -0.805,
                   0.952,  -2.026]
    z_max_m: 2.9                       # ceiling [m]
    edge_proximity_threshold_m: 0.05   # flagged when closer than this to a wall or the ceiling [m]
