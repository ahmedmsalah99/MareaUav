# mocap_bridge parameters. Same file for the mocap lab (M2M_MODE=1) and mocap in sim (M2M_MODE=3):
# in the lab natnet_ros2 publishes the rigid bodies, in sim the landingplat plugin does, on the same topics.
# No in-code defaults: a missing key stops the node at startup.
mocap_bridge:
  ros__parameters:
    drone_pose_topic:          /drone/pose     # PoseStamped of the drone rigid body (ENU, Z-up)
    pad_pose_topic:            /pad/pose       # PoseStamped of the pad rigid body (ENU, Z-up)
    world_yaw_offset_rad:      0.0             # Rotates the mocap world about Z into the ENU frame PX4/guidance use [rad]. Lab: set so mocap +X points where you want world East.
    position_std_m:            0.005           # Mocap position noise sent to PX4 as variance (std^2) [m]
    orientation_std_rad:       0.01            # Mocap orientation noise sent to PX4 as variance (std^2) [rad]
    pose_timeout_s:            0.3             # A body not seen for this long stops being forwarded (warns) [s]
    pad_nav_rate_hz:           10.0            # Rate of /ulisse/nav_filter/data (the recorded boat data is ~10 Hz) [Hz]
    pad_imu_rate_hz:           50.0            # Rate of /adnav_node/imu_raw [Hz]
    pad_velocity_tau_s:        0.2             # Low-pass time constant on the pad's differentiated velocity/rates [s]
