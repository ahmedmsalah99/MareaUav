# Apriltag node parameters for M2M_MODE=1 (mocap). Was cfg/platform_real.yaml + the real layout in LandingPlatform.h.
# Tag 0 (placeholder size 0.001, no layout) is dropped: it is not on the real pad.
apriltag:
    apriltag2:
        ros__parameters:
            image_transport: compressed
            family: 36h11           # tag family, one of 16h5, 25h7, 25h9, 36h10, 36h11, 36artoolkit
            size: 0.195             # tag edge size in meter
            max_hamming: 0          # maximum allowed hamming distance (corrected bits)
            z_up: true              # rotate about x-axis to have Z pointing upwards

            # see "apriltag.h" for more documentation on these optional parameters
            decimate: 2.0           # decimate resolution for quad detection
            blur: 0.0               # sigma of Gaussian blur for quad detection
            refine-edges: 1         # snap to strong gradients
            threads: 1              # number of threads
            refine-decode: 0        # increase the number of detected tags
            refine-pose: 0          # increase the accuracy of the extracted pose
            debug: 0                # write additional debugging images to current working directory

            x_err_thld: 500.0
            y_err_thld: 500.0
            z_err_thld: 500.0
            iter_err_thld: 30.0

            # ---- Camera intrinsics [pixels] (640x480) ----
            # NOTE: the same numbers are used in every mode for now. fx/fy match the sim camera
            # (640 px, 80 deg FOV); cx/cy look like a real calibration. Re-check against the real
            # camera's calibration during hardware adaptation.
            camera.fx: 381.36246688113556
            camera.fy: 381.36246688113556
            camera.cx: 323.83127
            camera.cy: 248.651286

            # ---- Camera mounting: camera pose in the drone body frame [m, rad] ----
            # Rotation = Rz(yaw) * Ry(pitch) * Rx(roll): today the camera is flipped about x (looking down)
            # and turned -90 deg about z.
            # Same in every mode: matches the sim model (iris.sdf: 0.06 0 -0.03) and the mocap measurement.
            camera_mount.x: 0.06
            camera_mount.y: 0.0
            camera_mount.z: -0.03
            camera_mount.roll: 3.14159265
            camera_mount.pitch: 0.0
            camera_mount.yaw: -1.570796325

            # ---- Tag layout (real pad) ----
            # One entry per tag on the pad; tags not listed are ignored.
            # size: tag edge [m]. ref_x/ref_y: position of the pad reference point in that tag's own frame [m].
            tags.ids:   [1, 2, 3, 4, 5, 6, 7, 8, 9]
            tags.size:  [0.195, 0.195, 0.195, 0.195, 0.025, 0.035, 0.035, 0.035, 0.035]
            tags.ref_x: [0.243182, -0.242693, -0.240737, 0.24212, 0.0, 0.163, -0.009, -0.165, -0.017]
            tags.ref_y: [0.245111, 0.244019, -0.248717, -0.248299, 0.0, 0.004, 0.165, 0.0045, -0.174]
